<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="apple-mobile-web-app-title" content="かんいろの旅">
<title>かんいろの旅</title>
<style>
:root{
  --paper:#F1F6EE;--card:#FFFFFF;--ink:#1F3A5F;--sub:#5B6F86;--road:#E8B04A;--grass:#6DB57F;
  --flag:#E4572E;--sky:#D6ECF5;--ok:#2E9E5B;--ng:#D64545;--line:#D5E2D0;--key:#F6F9F4;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#14211C;--card:#1E2E28;--ink:#EAF2EC;--sub:#A9BDB2;--road:#C99434;--grass:#3F7D55;
  --flag:#F06A44;--sky:#21394A;--ok:#4CC27E;--ng:#F07070;--line:#2F453C;--key:#263830;color-scheme:dark}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","BIZ UDPGothic","Yu Gothic UI",sans-serif;
  line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:28px;margin:4px 0 2px;letter-spacing:.04em}
.lead{color:var(--sub);margin:0 0 14px;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--flag);outline-offset:2px}
.players{display:flex;gap:8px;margin-bottom:12px}
.players button{flex:1;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:17px}
.players button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.mapbox{background:var(--sky);border-radius:22px;padding:8px;position:relative}
.mapbox svg{width:100%;height:auto;display:block}
.streak{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 6px;font-size:15px}
.days{display:flex;gap:6px}
.day{width:30px;text-align:center;font-size:11px;color:var(--sub)}
.day b{display:block;width:26px;height:26px;margin:0 auto 2px;border-radius:50%;border:2px dashed var(--line)}
.day.on b{background:var(--road);border:2px solid var(--road)}
.day.today b{border-color:var(--ink)}
.big{display:block;width:100%;padding:16px;border:none;border-radius:18px;background:var(--flag);color:#fff;font-size:21px;font-weight:700;margin-top:14px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.sec{margin-top:22px;font-size:16px;font-weight:700}
.lvlist{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.lv{text-align:left;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:14px}
.lv span{display:block;font-size:12px;color:var(--sub)}
.lv .st{color:var(--road);font-size:13px}
/* quiz */
.top{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--sub)}
.quit{background:none;border:none;color:var(--sub);text-decoration:underline;padding:4px}
.track{position:relative;height:44px;margin:4px 0 10px}
.track .rd{position:absolute;left:8px;right:8px;top:24px;height:8px;border-radius:4px;background:var(--road)}
.track .dot{position:absolute;top:21px;width:14px;height:14px;border-radius:50%;background:var(--card);border:3px solid var(--road);transform:translateX(-7px)}
.track .dot.ok{background:var(--ok);border-color:var(--ok)}
.track .dot.ng{background:var(--ng);border-color:var(--ng)}
.walker{position:absolute;top:-2px;font-size:24px;transform:translateX(-12px);transition:left .5s ease}
.card{background:var(--card);border-radius:20px;padding:18px;border:2px solid var(--line)}
.tag{display:inline-block;font-size:13px;padding:2px 10px;border-radius:999px;background:var(--ink);color:var(--paper);margin-bottom:6px}
.q{font-size:19px;margin:6px 0 12px;line-height:1.8}
.ansrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:19px}
.field{min-width:96px;height:52px;border-radius:12px;border:3px solid var(--line);background:var(--paper);font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 10px}
.field.act{border-color:var(--ink)}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.keys.calc{grid-template-columns:repeat(5,1fr);gap:7px}
.keys.calc button{height:54px;font-size:22px;padding:0}
.keys.calc .op{background:color-mix(in srgb,var(--road) 22%,var(--key));border-color:color-mix(in srgb,var(--road) 50%,var(--line))}
.keys.calc .eq{background:color-mix(in srgb,var(--ink) 14%,var(--key))}
.keys.num{grid-template-columns:repeat(4,1fr)}
.keys.num button{height:56px;font-size:24px}
.keys.calc .fn,.keys.num .fn{font-size:18px;color:var(--sub)}
.fwrap{display:flex;flex-direction:column;align-items:flex-start;max-width:100%}
.field{max-width:100%;overflow-x:auto;white-space:nowrap}
.pl{display:flex;align-items:center;gap:6px;margin-right:6px}
.pre{font-size:16px;font-weight:700;min-width:3.6em}
.ansrow:has(.pl){flex-direction:column;align-items:flex-start}
.prev{font-size:15px;color:var(--sub);margin-top:2px;padding-left:4px}
.keys button{height:56px;border-radius:14px;border:2px solid var(--line);background:var(--key);font-size:24px;font-weight:700}
.go{display:block;width:100%;height:56px;margin-top:8px;border-radius:14px;border:none;background:var(--ok);color:#fff;font-size:20px;font-weight:700}
.hintbtn{background:none;border:2px dashed var(--road);border-radius:12px;padding:6px 12px;font-size:14px;margin-top:10px}
.hint{margin-top:10px;padding:12px;border-radius:14px;background:var(--sky);font-size:15px}
.hint svg{width:100%;max-width:340px;height:auto;display:block;margin:8px auto 0}
.fb{margin-top:12px;padding:14px;border-radius:14px;font-size:15px}
.fb.ok{background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.fb.ng{background:color-mix(in srgb,var(--ng) 14%,var(--card))}
.fb h3{margin:0 0 4px;font-size:20px}
.fb p{margin:2px 0}
.next{margin-top:10px}
/* result */
.res{text-align:center}
.res .stars{font-size:54px;font-weight:800;margin:8px 0 0}
.res .msg{font-size:18px;margin:6px 0 14px}
.res table{width:100%;border-collapse:collapse;font-size:14px;text-align:left}
.res td{padding:6px 4px;border-bottom:1px solid var(--line)}
.res td:last-child{text-align:right;color:var(--road);white-space:nowrap}
.ghost{display:block;width:100%;padding:12px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-size:17px;margin-top:10px}
.tate{display:inline-block;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:22px;text-align:right;line-height:1.35;margin:6px 0 6px 12px;letter-spacing:.12em}
.tate .op{float:left;margin-right:10px}
.tate .ans{border-top:2px solid currentColor;min-height:1.35em}
.mushi{display:grid;width:max-content;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:24px;line-height:1;gap:6px 4px;margin:8px 0 4px 12px;text-align:center}
.mushi span{width:34px;height:36px;display:flex;align-items:center;justify-content:center}
.mushi .h{border:2px solid currentColor;border-radius:6px;font-size:17px;font-weight:700;color:var(--flag);border-color:var(--flag)}
.mushi .bar{grid-column:1/-1;height:0;border-top:2px solid currentColor;width:100%}
.adbox{margin:12px 0 0;padding:12px 14px;border-radius:16px;background:var(--card);border:2px solid var(--line)}
.adbox b{display:block;font-size:16px}.adbox span{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.levelup{margin:0 0 12px;padding:10px;border-radius:14px;background:color-mix(in srgb,var(--road) 25%,var(--card));font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.lock{min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.lock h1{font-size:26px}.lock p{color:var(--sub);margin:4px 0 16px}
.pins{display:flex;gap:12px;justify-content:center;margin-bottom:8px}
.pins i{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink)}
.pins i.on{background:var(--ink)}
.lock .keys{width:100%;max-width:300px;grid-template-columns:repeat(3,1fr)}
.lock .err{color:var(--ng);min-height:24px;font-size:15px}
.back{background:none;border:none;color:var(--sub);padding:4px 0;font-size:15px}
.subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.subj{text-align:left;padding:16px 14px;border-radius:20px;border:none;background:var(--sc);color:#fff;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.subj:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.subj .ic{font-size:30px;line-height:1}
.subj b{font-size:24px;letter-spacing:.1em}
.subj small{font-size:13px;opacity:.92}
.subj.empty{opacity:.55}
.units{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.unit{text-align:left;padding:14px 16px;border-radius:18px;border:2px solid var(--line);border-left:8px solid var(--sc);background:var(--card)}
.unit b{font-size:19px}.unit span{display:block;font-size:13px;color:var(--sub)}
.bar{height:8px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--road)}
.emptybox{margin-top:14px;padding:22px;border-radius:18px;border:2px dashed var(--line);text-align:center;color:var(--sub)}
.choices{display:flex;flex-direction:column;gap:8px;width:100%}
.choices button{text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--key);font-size:18px}
.choices button.x{opacity:.45;text-decoration:line-through}
.choices button.c{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="app.js"></script>

</body>
